# 3 services = 3 conteneurs qui travaillent ensemble
services:
  app:                      # PHP 8.4 + Composer (construit depuis notre Dockerfile)
    build: ./docker/php
    # Laravel doit pouvoir écrire ses logs et son cache : on donne les droits puis on lance PHP-FPM
    command: sh -c "chmod -R 777 storage bootstrap/cache 2>/dev/null; php-fpm"
    volumes:
      - ./src:/var/www/html # le code sur ton PC est partagé avec le conteneur
    depends_on:
      - db

  web:                      # Nginx : reçoit les requêtes HTTP et les passe à PHP
    image: nginx:1.27-alpine
    ports:
      - "8080:80"           # http://localhost:8080 sur ton PC -> port 80 du conteneur
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:                       # MySQL 8.4
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: payments
      MYSQL_USER: app
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql   # volume nommé : les données survivent à un "down"
  
  phpmyadmin:             # phpMyAdmin : interface web pour gérer MySQL
    image: phpmyadmin:5.2
    environment:
      PMA_HOST: db
      PMA_USER: app
      PMA_PASSWORD: secret
    ports:
      - "8081:80"           # http://localhost:8081 sur ton PC -> port 80 du conteneur
    depends_on:
      - db
volumes:
  dbdata:
